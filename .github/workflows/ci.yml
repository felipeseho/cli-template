name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.15.0
            coverage: false
          - os: ubuntu-latest
            node: 24
            coverage: true
          - os: macos-latest
            node: 24
            coverage: false
          - os: windows-latest
            node: 24
            coverage: false

    env:
      CI: true
      NO_COLOR: 1
      NO_MOTION: 1
      NO_UNICODE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        if: ${{ !matrix.coverage }}
        run: npm test

      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Generate and verify oclif manifest
        run: |
          npm run manifest
          node --input-type=module --eval "import {readFileSync} from 'node:fs'; const manifest = JSON.parse(readFileSync('oclif.manifest.json', 'utf8')); if (!manifest.commands?.ui) throw new Error('Generated manifest is missing the ui command')"

      - name: Smoke test packaged CLI
        run: npm run smoke:package
